apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: playback-space
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      name: client
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: alisameed/playback-space-client-beta:v4

          env:
            - name: API_UPSTREAM
              value: "http://backend-service:8000"

          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: playback-space
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 31000