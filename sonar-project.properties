# ============================================================
# SonarQube project configuration
# Place this file at the ROOT of the repository
# ============================================================

# Project identification (must match Jenkins sonarqube_analysis() call)
sonar.projectKey=playback-space
sonar.projectName=playback-space
sonar.projectVersion=1.0

# Sources to analyse
sonar.sources=backend/src,client/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js

# JavaScript / TypeScript
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
