global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter – host-level metrics (CPU, RAM, disk)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PlaybackSpace Backend (Express)
  # Add prom-client to backend and expose /metrics to enable this
  - job_name: 'playback-backend'
    static_configs:
      - targets: ['host.docker.internal:31100']
    metrics_path: '/metrics'
